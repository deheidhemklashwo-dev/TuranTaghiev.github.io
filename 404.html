<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>404 — Turan Taghiev</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23171a1d'/%3E%3Ctext x='50%25' y='52%25' font-family='Georgia,serif' font-size='38' fill='%23b08d57' text-anchor='middle' dominant-baseline='central'%3ET%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#111315;--text:#e7e3db;--text-mute:#74787a;--accent:#b08d57;
    --serif:"Newsreader",Georgia,serif;--mono:"IBM Plex Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(231,227,219,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(231,227,219,.05) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000,transparent 75%);opacity:.5}
  .box{position:relative;z-index:1}
  .code{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:24px}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.4rem,7vw,4rem);line-height:1.05;letter-spacing:-.02em;margin-bottom:20px}
  p{color:var(--text-mute);font-family:var(--serif);font-size:1.1rem;max-width:42ch;margin:0 auto 38px;line-height:1.5}
  a{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:14px 26px;border-radius:2px;text-decoration:none;transition:opacity .2s}
  a:hover{opacity:.85}
</style>
</head>
<body>
  <div class="box">
    <div class="code">Error 404</div>
    <h1>This page doesn't exist.</h1>
    <p>The page you were looking for may have moved, or never existed in the first place.</p>
    <a href="/TuranTaghiev.github.io/">← Back to home</a>
  </div>
</body>
</html>
