# PR denetimi: feed.xml / sitemap.xml, PR'daki index.html (ANALYSES) ile tutarlı mı?
# Yalnızca bu dosyalara ya da üretece elle dokunan PR'larda çalışır. Yazı PR'ları (yalnızca
# index.html) burada denetlenmez: feed'i onlar için günlük bot (feeds-update.yml) üretir.
# Yalnızca gerçek tutarsızlıkta kırmızı olur; yayın günü gelmiş ama henüz eklenmemiş
# zamanlanmış bir yazı tutarsızlık sayılmaz.
name: Feed & sitemap check

on:
  pull_request:
    paths: ["feed.xml", "sitemap.xml", "tools/build-feeds.js"]

# Yalnızca kodu okur: checkout için contents:read yeterli.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/build-feeds.js --check
